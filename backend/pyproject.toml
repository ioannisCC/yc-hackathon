[project]
name = "ai-receptionist"
version = "0.1.0"
description = "Paste a URL, get a phone-staffed AI receptionist in under 5 minutes."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "agentphone",
    "standardwebhooks>=1.0",
    "supermemory",
    "agentmail",
    "browser-use-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
