[project]
name = "ai-receptionist"
version = "0.1.0"
description = "Paste a URL, get a phone-staffed AI receptionist in under 5 minutes."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.1",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "agentphone",
    "supermemory",
    "agentmail",
    "browser-use-sdk",
]

# Moss SDK is local-only: it depends on inferedge-moss-core 0.11.0, which
# is not published on PyPI for Linux (only 0.1.0-0.4.1 available as of
# 2026-05-18), so the Railway build cannot resolve it. Install on Mac with
# `uv sync --extra local` to seed Moss indexes; production keeps the REST
# fallback path in moss_svc. See HANDOFF_NOTES.md for the full story.
[project.optional-dependencies]
local = ["moss>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
